# ===============================
# APPLICATION
# ===============================
spring.application.name=student-management-backend
server.port=8080
app.backend-url=http://localhost:8080
app.frontend-url=http://localhost:5175

# ===============================
# DATABASE - MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/student_management\
?useSSL=false\
&serverTimezone=Asia/Ho_Chi_Minh\
&characterEncoding=utf8

spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# DEV: t? t?o / update table t? entity
spring.jpa.hibernate.ddl-auto=update

# Hibernate 6 (Spring Boot 3) t? detect dialect -> KHÔNG c?n set
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Khuyên t?t Open-In-View ?? tránh query ng?m
spring.jpa.open-in-view=false

# ===============================
# HIKARI CP (CONNECTION POOL)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=StudentHikariCP

# ===============================
# LOGGING (DEBUG SQL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JWT CONFIG
# ===============================
# 256-bit secret (DEV)
jwt.secret=student-management-secret-key-256-bit-long-for-dev-only
jwt.expiration=86400000

# ===============================
# CORS (REACT FE)
# ===============================
spring.web.cors.allowed-origins=http://localhost:5175
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
# ================= MAIL CONFIG =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hoanganhyb2003@gmail.com
spring.mail.password=faqoambuvxaltkoq

# ================= AVATAR UPLOAD =================
app.upload.avatar-dir=uploads/avatars
app.public.base-url=http://localhost:8080

# limit multipart (Spring)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

