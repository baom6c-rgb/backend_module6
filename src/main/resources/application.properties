# ===== APPLICATION =====
spring.application.name=student-management-backend
server.port=${SERVER_PORT:8080}

app.backend-url=${BACKEND_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5175}

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== HIKARI =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=StudentHikariCP

# ===== LOGGING =====
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== CORS =====
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5175}
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ===== MAIL (SMTP credentials only) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# (Optional) legacy env for default admin email (NOT used directly at runtime anymore)
admin.email=${ADMIN_EMAIL:}

# ===== UPLOAD =====
app.upload.avatar-dir=${UPLOAD_AVATAR_DIR:uploads/avatars}
app.public.base-url=${PUBLIC_BASE_URL:${BACKEND_URL:http://localhost:8080}}

# ===== MULTIPART =====
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ===== AI (GEMINI) =====
# NOTE:
# - base-url + model v?n ?? ? properties
# - API KEY không dùng ? ?ây n?a (runtime l?y t? DB SystemSettings)
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ===== SYSTEM SETTINGS DEFAULT (DB fallback / init) =====
# NOTE:
# - Admin ch?nh trong DB qua /api/admin/settings
# - Các giá tr? bên d??i ch? dùng ?? init l?n ??u (khi DB ch?a có row settings)
app.settings.default.passScore=${AI_PRACTICE_PASS_SCORE:80}
app.settings.default.minutesPerQuestion=${AI_PRACTICE_DURATION_PER_QUESTION_MINUTES:2.0}
app.settings.default.retestCooldownMinutes=${AI_PRACTICE_RETEST_COOLDOWN_MINUTES:30}
app.settings.default.emailNotificationsEnabled=${EMAIL_NOTI_ENABLED:true}
app.settings.default.adminEmails=${ADMIN_EMAIL:}
app.settings.default.practice.mcqQuestionCount=8
app.settings.default.practice.essayQuestionCount=2

# ===== SYSTEM SETTINGS DEFAULT - AI (init one time) =====
# NOTE:
# - Các giá tr? này ch? dùng khi t?o row SystemSettings l?n ??u (id=1)
# - Sau ?ó Admin ??i trong UI tab "Model AI" và KHÔNG c?n restart BE
app.settings.default.ai.provider=${AI_PROVIDER:GEMINI}
app.settings.default.ai.model=${AI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
app.settings.default.ai.temperature=${AI_TEMPERATURE:0.0}
app.settings.default.ai.enabled=${AI_ENABLED:true}
# ?u tiên AI_API_KEY, n?u không có thì fallback GEMINI_API_KEY
app.settings.default.ai.apiKey=${AI_API_KEY:${GEMINI_API_KEY:}}

# ===== Monthly Admin Report defaults =====
# monthlyReport.dayOfMonth: 0 = last day of month
app.settings.default.monthlyReport.enabled=${MONTHLY_REPORT_ENABLED:false}
app.settings.default.monthlyReport.dayOfMonth=${MONTHLY_REPORT_DAY_OF_MONTH:0}
app.settings.default.monthlyReport.time=${MONTHLY_REPORT_TIME:23:59}
app.settings.default.monthlyReport.timeZone=${MONTHLY_REPORT_TIME_ZONE:Asia/Bangkok}

# ===== AI PRACTICE (Quiz) =====
# max-questions v?n có th? gi? ? properties (admin không c?n ch?nh)
ai.practice.max-questions=${AI_PRACTICE_MAX_QUESTIONS:20}

# Practice session cache (V2)
ai.practice.session-ttl-minutes=${AI_PRACTICE_SESSION_TTL_MINUTES:180}
ai.practice.session-cache.max-size=${AI_PRACTICE_SESSION_CACHE_MAX_SIZE:5000}

# Feedback formatting
ai.practice.feedback.max-bullets=${AI_PRACTICE_FEEDBACK_MAX_BULLETS:8}
