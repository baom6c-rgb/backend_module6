services:
  mysql:
    image: mysql:8.4
    container_name: ai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: baom6c/be-ai-learning-platform:latest
    container_name: ai_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      UPLOAD_AVATAR_DIR: ${UPLOAD_AVATAR_DIR}
      MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE}
      MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE}

      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_MODEL: ${GEMINI_MODEL}

      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE}

      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_TEMPERATURE: ${AI_TEMPERATURE}
      AI_ENABLED: ${AI_ENABLED}
      AI_API_KEY: ${AI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      AI_PRACTICE_PASS_SCORE: ${AI_PRACTICE_PASS_SCORE}
      AI_PRACTICE_DURATION_PER_QUESTION_MINUTES: ${AI_PRACTICE_DURATION_PER_QUESTION_MINUTES}
      AI_PRACTICE_RETEST_COOLDOWN_MINUTES: ${AI_PRACTICE_RETEST_COOLDOWN_MINUTES}
      AI_PRACTICE_MAX_QUESTIONS: ${AI_PRACTICE_MAX_QUESTIONS}
      AI_PRACTICE_SESSION_TTL_MINUTES: ${AI_PRACTICE_SESSION_TTL_MINUTES}
      AI_PRACTICE_SESSION_CACHE_MAX_SIZE: ${AI_PRACTICE_SESSION_CACHE_MAX_SIZE}
      AI_PRACTICE_FEEDBACK_MAX_BULLETS: ${AI_PRACTICE_FEEDBACK_MAX_BULLETS}

      EMAIL_NOTI_ENABLED: ${EMAIL_NOTI_ENABLED}

      MONTHLY_REPORT_ENABLED: ${MONTHLY_REPORT_ENABLED}
      MONTHLY_REPORT_DAY_OF_MONTH: ${MONTHLY_REPORT_DAY_OF_MONTH}
      MONTHLY_REPORT_TIME: ${MONTHLY_REPORT_TIME}
      MONTHLY_REPORT_TIME_ZONE: ${MONTHLY_REPORT_TIME_ZONE}

      AI_KEY_PATH: /app/data/secrets/ai_api_key.json
      APP_SECRET_MASTER_KEY: ${APP_SECRET_MASTER_KEY}

      OTP_EXPIRE_SECONDS: ${OTP_EXPIRE_SECONDS}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      OTP_MAX_RESEND: ${OTP_MAX_RESEND}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped

volumes:
  mysql_data: