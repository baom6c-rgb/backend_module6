services:
  mysql:
    image: mysql:8.4
    container_name: ai_mysql
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: .
    container_name: ai_backend
    env_file:
      - .env.docker
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped

volumes:
  mysql_data: